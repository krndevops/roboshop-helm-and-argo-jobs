env: dev
replica: 1
PARAMS: "dev.roboshop.cart.REDIS_HOST,REDIS_HOST dev.roboshop.cart.CATALOGUE_HOST,CATALOGUE_HOST dev.roboshop.cart.CATALOGUE_PORT,CATALOGUE_PORT"
component: cart

service:
  port: 80
  containerPort: 8080

initContainers:
  parameters_pull:
    image: 367241114876.dkr.ecr.us-east-1.amazonaws.com/default/parameter-store-init-container-image:1.0.0
    imagePullPolicy: Always

containers:
  main:
    image: 367241114876.dkr.ecr.us-east-1.amazonaws.com/default/cart:1.0.0
    imagePullPolicy: Always

resources:
  requests:
    memory: "100Mi"
    cpu: "100m"
  limits:
    memory: "150Mi"
    cpu: "100m"
