env: dev
replica: 1
PARAMS: "dev.roboshop.catalogue.MONGO_URL,MONGO_URL"

job:
  enabled: true
  PARAMS: "dev.roboshop.docdb.username,DOCDB_USER dev.roboshop.docdb.password,DOCDB_PASS dev.roboshop.docdb.endpoint,DOCDB_ENDPOINT"

component: catalogue
schema_type: mongo
service:
  port: 80
  containerPort: 8080

initContainers:
  parameters_pull:
    image: 367241114876.dkr.ecr.us-east-1.amazonaws.com/default/parameter-store-init-container-image:1.0.0
    imagePullPolicy: Always

containers:
  main:
    image: 367241114876.dkr.ecr.us-east-1.amazonaws.com/default/catalogue:1.0.0
    imagePullPolicy: Always
  schema_loader:
    image: 367241114876.dkr.ecr.us-east-1.amazonaws.com/default/schema-loader:1.0.0
    imagePullPolicy: Always

