env: prod
replica: 2
component: frontend
service:
  port: 80
  containerPort: 80

initContainers:
  parameters_pull:
    image: 367241114876.dkr.ecr.us-east-1.amazonaws.com/default/parameter-store-init-container-image:1.0.0
    imagePullPolicy: Always

containers:
  main:
    image: 367241114876.dkr.ecr.us-east-1.amazonaws.com/default/frontend:1.0.0
    imagePullPolicy: Always

ingress:
  enabled: true

resources:
  requests:
    memory: "100Mi"
    cpu: "100m"
  limits:
    memory: "150Mi"
    cpu: "100m"